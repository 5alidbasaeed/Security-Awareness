# Public server block only — proxies exclusively to Gophish's phish-listener
# port. Nginx is a member of the `public` Docker network only (see
# docker-compose.yml). Gophish is on `public` too, so what keeps its admin/API
# port out of nginx's reach is Gophish binding that listener to its
# internal-network address only (GOPHISH_ADMIN_LISTEN) — not this file. This
# config also never references the admin port. See CLAUDE.md invariant #8 and
# README check 6.
#
# TLS/Certbot for the real sending domain is a Phase-0 follow-up against a
# real host + domain (see README.md) — this is a plain HTTP config for local
# verification only.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://gophish:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Django dashboard is intentionally NOT proxied here. It has no route from the
# public network in this scaffold — real-deployment access is via VPN/SSH
# tunnel directly to the internal Docker network, documented in README.md as
# a host-infrastructure follow-up, not something nginx should expose.
