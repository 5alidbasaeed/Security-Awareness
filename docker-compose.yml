# Phase 0 infra-proof stack. See CLAUDE.md invariant #8 and
# phishing-training-platform-plan.md "Security Isolation" for the network
# topology this file implements.
#
# NOTE (local-dev-only exception): django publishes 8000:8000 directly to the
# host so this stack can be verified without VPN infrastructure. A real
# deployment removes that `ports:` entry — Django's admin/dashboard is reached
# via VPN/SSH tunnel into the `internal` network, never a published host port.
# See README.md.

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true # no outbound gateway — defense in depth beyond "no published ports"

volumes:
  postgres-data:
  mysql-data:

services:
  postgres:
    image: postgres:16
    networks: [internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    networks: [internal]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gophish:
    build:
      context: ./gophish
      dockerfile: Dockerfile
    networks: [public, internal] # both, per the plan doc's own network description — see CLAUDE.md
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # No `ports:` entry — admin (3333) and phish (80) are reachable only via
    # the Docker networks above, never published to the host.

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000" # local-dev-only exception, see file header
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    command: celery -A config worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    command: celery -A config beat --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    networks: [public]
    depends_on: [gophish]
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
