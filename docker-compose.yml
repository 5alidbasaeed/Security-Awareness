# Phase 0 infra-proof stack. See CLAUDE.md invariant #8 and
# phishing-training-platform-plan.md "Security Isolation" for the network
# topology this file implements.
#
# Nothing on the `internal` network publishes a host port, by design — Django's
# admin/dashboard is reached via VPN/SSH tunnel into that network on a real
# deployment, never a published host port. Locally, verify via
# `docker compose exec <service> curl ...` — see README.md.

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true # no outbound gateway — defense in depth beyond "no published ports"

volumes:
  postgres-data:
  mysql-data:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    networks: [internal]
    # Gophish's oldest migrations (last touched pre-2024) insert zero-dates
    # ('0000-00-00') that MySQL 8's default strict sql_mode rejects outright.
    # Relaxing it is what makes an unmaintained upstream project boot on a
    # current MySQL at all — another concrete reason to revisit the
    # upstream-vs-fork decision (see CLAUDE.md open decision #4).
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gophish:
    build:
      context: ./gophish
      dockerfile: Dockerfile
    # unless-stopped, not just left to die: Gophish's mail-sending worker
    # can panic and crash the whole process on a bad/unreachable sending
    # profile (confirmed live — see CLAUDE.md "Known deployment quirks").
    # Without a restart policy a crash like that is silent until someone
    # happens to check; auto-restart at least bounds the downtime. It does
    # not fix the underlying campaign stuck mid-send — that still needs
    # operator attention.
    restart: unless-stopped
    networks: [public, internal] # both, per the plan doc's own network description — see CLAUDE.md
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # No `ports:` entry — admin (3333) and phish (80) are reachable only via
    # the Docker networks above, never published to the host.

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # No `ports:` entry: Docker Desktop doesn't forward host-published ports
    # onto a network marked `internal: true` anyway (verified empirically —
    # the binding shows in HostConfig but never actually listens), so the
    # "local-dev convenience port" this used to have didn't work in practice.
    # Verify Django via `docker compose exec django curl ...` (see README) —
    # which also better matches the real deployment (VPN/tunnel, no published
    # port) than a host port ever did.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    command: celery -A config worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    command: celery -A config beat --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [public]
    depends_on: [gophish]
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
