# LOCAL DEV ONLY — not used in a real deployment. Gives the Django admin a
# browser-reachable URL on this machine without touching the production
# network topology in docker-compose.yml. A real deployment reaches Django
# via VPN/SSH tunnel into the `internal` network (see CLAUDE.md invariant
# #8) — this override exists purely so a developer can open
# http://localhost:8000/admin/ locally.
#
# Why not just add `ports:` to django in docker-compose.yml directly?
# Docker Desktop doesn't forward host-published ports onto a network marked
# `internal: true` (see CLAUDE.md "Known deployment quirks") — publishing a
# port there silently does nothing. This override instead puts django on a
# second, non-internal bridge network dedicated to local dev access, in
# addition to `internal` (not instead of it), so its existing
# service-to-service communication (Postgres, Redis, etc.) is unaffected.
#
# DELIBERATELY named *.dev.yml, not *.override.yml: `docker compose` only
# auto-loads a file literally named `docker-compose.override.yml`. Naming it
# that would mean a real deployment running the plain, standard
# `docker compose up` command — exactly what someone does on a fresh
# `git clone` of this repo — silently gets Django's admin exposed on :8000
# with no explicit opt-in. Given invariant #8 calls network isolation "a
# hard requirement, not hardening," relying on "remember to delete this file
# before deploying" is not good enough. Load it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  django:
    networks:
      - internal
      - devaccess
    ports:
      - "8000:8000"
  # Same rationale as django above: lets a developer reach Gophish's admin
  # UI (:3333) locally to configure templates/landing pages/sending
  # profiles/groups and fetch the API key — none of that has a Django-side
  # equivalent yet. Gophish keeps its existing public+internal membership
  # from docker-compose.yml; this only adds a third, dev-only network.
  gophish:
    networks:
      - public
      - internal
      - devaccess
    ports:
      - "3333:3333"

networks:
  devaccess:
    driver: bridge
