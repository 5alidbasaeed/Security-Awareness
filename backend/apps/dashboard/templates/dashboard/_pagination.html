{% load dashboard %}{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span>
  <span class="pagination__links">
    {% if page.has_previous %}<a href="{% qs page=page.previous_page_number %}"{% if hx %} hx-get="{% qs page=page.previous_page_number %}"{% endif %} rel="prev">← Previous</a>{% endif %}
    {% if page.has_next %}<a href="{% qs page=page.next_page_number %}"{% if hx %} hx-get="{% qs page=page.next_page_number %}"{% endif %} rel="next">Next →</a>{% endif %}
  </span>
</nav>
{% endif %}
