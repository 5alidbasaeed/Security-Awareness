{% if chart.has_data %}
<div class="chart">
  <canvas data-chart-source="{{ chart_id }}" role="img" aria-label="{{ label }}"></canvas>
</div>
{{ chart|json_script:chart_id }}
{% else %}
<div class="empty">
  <strong>{{ empty_title|default:"No score history yet" }}</strong>
  {{ empty_text|default:"Scores appear here once campaign results start arriving." }}
</div>
{% endif %}
