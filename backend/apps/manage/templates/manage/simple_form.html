{% extends "manage/base.html" %}
{% block title %}{{ title }} · Manage{% endblock %}
{% block content %}
<header class="page-header"><div><h1>{{ title }}</h1></div></header>
<div class="card"><div class="card__body">
  <form class="form-stack" method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="form-error" role="alert">{{ form.non_field_errors.0 }}</p>{% endif %}
    {% include "manage/_form_fields.html" %}
    <div class="form-actions">
      <button class="button" type="submit">Save</button>
      <a class="button button--quiet" href="{{ back }}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
